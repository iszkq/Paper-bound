<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.ico?v=2026.10.28.8" sizes="any"><link rel="icon" type="image/png" href="favicon.png?v=2026.10.28.8" sizes="64x64"><title>账号管理 · 纸间</title><link rel="stylesheet" href="styles.css?v=2026.10.28.8"><link rel="stylesheet" href="workspace.css?v=2026.10.28.8"><link rel="stylesheet" href="admin.css?v=2026.10.28.8"></head><body>
<header class="admin-header"><a href="index.html" class="admin-brand"><span class="brand-mark">纸</span>纸间</a><span>账号管理</span><a href="index.html" class="btn">返回我的文档</a></header>
<main class="admin-main">
<div class="admin-title-row"><div><h1>管理子账号</h1><p>账号各有独立文档库，可在这里管理访问权限。</p></div><button class="btn btn-primary" id="createUserBtn">＋ 创建子账号</button></div>
<section class="admin-settings" id="registrationSettings" aria-labelledby="registrationSettingsTitle" hidden>
  <div><h2 id="registrationSettingsTitle">注册设置</h2><p>新用户注册时需填写注册码，修改后立即生效。</p></div>
  <form id="registrationSettingsForm">
    <label for="adminRegistrationCode">注册码</label>
    <div class="admin-setting-controls"><input id="adminRegistrationCode" name="registrationCode" type="text" autocomplete="off" minlength="4" maxlength="64" required aria-describedby="registrationSettingsStatus"><button class="btn" id="saveRegistrationCode" type="submit">保存注册码</button></div>
    <p id="registrationSettingsStatus" role="status" aria-live="polite"></p>
  </form>
</section>
<div class="admin-tools"><label>搜索账号<input type="search" id="userSearch" placeholder="用户名或显示名称"></label><button class="btn" id="refreshUsers">刷新</button><span id="userTotal"></span></div><p id="adminError" class="form-error" role="alert"></p><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>账号</th><th>状态</th><th>文档 / 文件夹</th><th>最近同步</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table></div></main><script src="compat.js?v=2026.10.28.8"></script><script src="admin.js?v=2026.10.28.8"></script></body></html>
