name: Verify application
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest test_server test_install_data -q
      - run: bash -n start.sh
      - run: bash -n install.sh
      - run: bash install.sh --check --port 9188 --data-dir '/srv/纸间 数据'
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in compat.js engine.js workspace.js cloud.js library-order.js login.js admin.js shortcuts.js; do node --check "$file"; done
  native-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install with custom port
        run: sudo bash install.sh --port 19188
      - name: Initialize isolated CI installation
        run: |
          python3 - <<'PY'
          import http.cookiejar, json, os, secrets, urllib.request
          from pathlib import Path
          credentials = {'username': 'ci_admin', 'password': secrets.token_urlsafe(24)}
          library = {'folders': [{'id': 'reading', 'name': '阅读笔记', 'parentId': ''}], 'documents': [{'id': 'note', 'title': '升级前的文档', 'folderId': 'reading', 'data': {'title': '升级前的文档', 'author': '保留作者', 'paragraphs': [{'html': '<p>升级后必须保留的正文</p>', 'noteHtml': '保留分析'}]}}], 'activeId': 'note'}
          library.update(templates=[{'id': 'template', 'name': '升级前的模板', 'data': library['documents'][0]['data']}], defaultTemplateId='template')
          saved = Path(os.environ['RUNNER_TEMP']) / 'paper-bound-update-check.json'
          saved.write_text(json.dumps({'credentials': credentials, 'library': library}), encoding='utf-8')
          saved.chmod(0o600)
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          payload = json.dumps(credentials).encode()
          request = urllib.request.Request('http://127.0.0.1:19188/api/setup', data=payload, headers={'Content-Type': 'application/json'})
          with client.open(request) as response:
              assert json.load(response)['user']['role'] == 'admin'
          request = urllib.request.Request('http://127.0.0.1:19188/api/library', method='PUT', data=json.dumps({'revision': 0, 'library': library}).encode(), headers={'Content-Type': 'application/json'})
          with client.open(request) as response:
              assert json.load(response)['revision'] == 1
          PY
      - name: Update without specifying port
        run: sudo bash install.sh
      - name: Verify saved port, account preservation and backup
        run: |
          python3 - <<'PY'
          import http.cookiejar, json, os, urllib.request
          from pathlib import Path
          saved = json.loads((Path(os.environ['RUNNER_TEMP']) / 'paper-bound-update-check.json').read_text(encoding='utf-8'))
          with urllib.request.urlopen('http://127.0.0.1:19188/api/setup') as response:
              assert json.load(response)['required'] is False
          with urllib.request.urlopen('http://127.0.0.1:19188/api/version') as response:
              version = json.load(response)
              assert version['filesValid'] and not version['restartRequired']
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          request = urllib.request.Request('http://127.0.0.1:19188/api/login', data=json.dumps(saved['credentials']).encode(), headers={'Content-Type': 'application/json'})
          with client.open(request) as response:
              assert json.load(response)['user']['role'] == 'admin'
          with client.open('http://127.0.0.1:19188/api/library') as response:
              result = json.load(response)
              assert result['revision'] == 1 and result['library'] == saved['library']
          PY
          sudo python3 - <<'PY'
          import json, sqlite3
          from pathlib import Path
          backups = list(Path('/var/lib/paper-bound/backups').glob('notes-*.sqlite3'))
          assert backups, 'No update backup was created'
          with sqlite3.connect(str(max(backups, key=lambda path: path.name))) as db:
              library = json.loads(db.execute('SELECT content FROM libraries').fetchone()[0])
              assert library['documents'][0]['data']['paragraphs'][0]['html'] == '<p>升级后必须保留的正文</p>'
              assert library['templates'][0]['name'] == '升级前的模板' and library['defaultTemplateId'] == 'template'
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          PY
      - name: Change port on existing installation
        run: |
          sudo bash install.sh --port 19189
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:19189/api/setup') as response:
              assert json.load(response)['required'] is False
          PY
      - name: Migrate existing accounts and templates to custom data folder
        run: |
          sudo bash install.sh --data-dir '/opt/1panel/纸间 数据'
          sudo test -f '/opt/1panel/纸间 数据/notes.sqlite3'
          sudo test -f '/var/lib/paper-bound/notes.sqlite3'
          sudo bash install.sh
          sudo python3 - <<'PY'
          import json, sqlite3
          from pathlib import Path
          from deploy.install_data import previous
          port, data = previous()
          assert port == '19189' and data == '/opt/1panel/纸间 数据'
          root = Path(data)
          assert list((root / 'backups').glob('notes-*.sqlite3'))
          with sqlite3.connect(str(root / 'notes.sqlite3')) as db:
              library = json.loads(db.execute('SELECT content FROM libraries').fetchone()[0])
              assert library['templates'][0]['name'] == '升级前的模板'
              assert library['documents'][0]['data']['author'] == '保留作者'
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          PY
          python3 - <<'PY'
          import http.cookiejar, json, os, urllib.request
          from pathlib import Path
          saved = json.loads((Path(os.environ['RUNNER_TEMP']) / 'paper-bound-update-check.json').read_text(encoding='utf-8'))
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          request = urllib.request.Request('http://127.0.0.1:19189/api/login', data=json.dumps(saved['credentials']).encode(), headers={'Content-Type': 'application/json'})
          with client.open(request) as response:
              assert json.load(response)['user']['role'] == 'admin'
          with client.open('http://127.0.0.1:19189/api/library') as response:
              assert json.load(response)['library'] == saved['library']
          PY
      - name: Refuse overwriting another database and keep current service running
        run: |
          sudo install -d /srv/paper-bound-conflict
          sudo cp /var/lib/paper-bound/notes.sqlite3 /srv/paper-bound-conflict/notes.sqlite3
          if sudo bash install.sh --data-dir /srv/paper-bound-conflict; then
            echo 'Installer unexpectedly overwrote another database'
            exit 1
          fi
          curl --fail http://127.0.0.1:19189/api/version
      - name: Support protected home folder as data directory
        run: |
          sudo bash install.sh --data-dir '/root/纸间 数据'
          sudo bash install.sh
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:19189/api/setup') as response:
              assert json.load(response)['required'] is False
          PY
      - name: Reject occupied port without stopping current service
        run: |
          python3 - <<'PY'
          import json, socket, subprocess, sys, time, urllib.request
          process = subprocess.Popen([sys.executable, '-m', 'http.server', '19190', '--bind', '127.0.0.1'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              for _ in range(40):
                  try:
                      with socket.create_connection(('127.0.0.1', 19190), timeout=1):
                          break
                  except OSError:
                      time.sleep(.1)
              else:
                  raise AssertionError('Test listener did not start')
              result = subprocess.run(['sudo', 'bash', 'install.sh', '--port', '19190'], capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode != 0
              with urllib.request.urlopen('http://127.0.0.1:19189/api/setup') as response:
                  assert json.load(response)['required'] is False
          finally:
              process.terminate()
              process.wait(timeout=5)
          PY
      - name: Support low port with service capability
        run: |
          sudo bash install.sh --port 907
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:907/api/setup') as response:
              assert json.load(response)['required'] is False
          PY
      - name: Installation diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status paper-bound --no-pager || true
          sudo systemctl cat paper-bound || true
          sudo journalctl -u paper-bound -n 100 --no-pager || true
  native-custom-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fresh install with custom folder and port
        run: |
          sudo bash install.sh --port 19181 --data-dir '/srv/纸间 首次安装'
          sudo test -f '/srv/纸间 首次安装/notes.sqlite3'
          sudo bash install.sh
          python3 - <<'PY'
          import json, urllib.request
          from deploy.install_data import previous
          assert previous() == ('19181', '/srv/纸间 首次安装')
          with urllib.request.urlopen('http://127.0.0.1:19181/api/setup') as response:
              assert json.load(response)['required'] is True
          PY
  native-permission-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect inaccessible parent without installing a broken service, then retry safely
        run: |
          sudo install -d -o root -g root -m 700 /var/lib/paper-bound-locked-parent
          if sudo bash install.sh --port 19182 --data-dir /var/lib/paper-bound-locked-parent/data; then
            echo 'Installer did not detect the inaccessible parent directory'
            exit 1
          fi
          sudo test ! -f /etc/systemd/system/paper-bound.service
          sudo chmod 711 /var/lib/paper-bound-locked-parent
          sudo bash install.sh --port 19182 --data-dir /var/lib/paper-bound-locked-parent/data --retry-empty-first-install
          sudo test -f /var/lib/paper-bound-locked-parent/data/notes.sqlite3
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:19182/api/setup') as response:
              assert json.load(response)['required'] is True
          PY
